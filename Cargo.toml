[package]
name = "simdisplay"
version = "0.1.0"
edition = "2024"
description = "Native Rust sim racing dashboard studio"
license = "LicenseRef-Proprietary"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
directories = "6"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.15", default-features = false }
display-info = { version = "0.5", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[profile.release]
lto = "thin"
strip = true
